<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-label="Projects: AFTERSHOCK real-time seismic lakehouse, Taintrace Bitcoin sanctions screening, AI for Molecular Design, Phantera LLM outbound platform.">
  <defs>
    <pattern id="p-grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#4EF0C4" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <linearGradient id="p-flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4EF0C4" stop-opacity="0"/>
      <stop offset="50%" stop-color="#4EF0C4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4EF0C4" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="900" height="340" fill="#070A0B"/>
  <rect width="900" height="340" fill="url(#p-grid)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="50" y="46" fill="#4EF0C4" font-size="13" letter-spacing="5">PROJECTS</text>
    <text x="850" y="46" fill="#64756F" font-size="13" text-anchor="end" letter-spacing="2">BUILT SOLO</text>
  </g>
  <line x1="50" y1="62" x2="850" y2="62" stroke="#4EF0C4" stroke-opacity="0.2"/>
  <line x1="50" y1="62" x2="850" y2="62" stroke="url(#p-flow)" stroke-width="2" stroke-dasharray="130 670">
    <animate attributeName="stroke-dashoffset" values="800;0" dur="6s" repeatCount="indefinite"/>
  </line>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.25s" fill="freeze"/>
    <rect x="50" y="84" width="392" height="112" fill="#0C1214" stroke="#4EF0C4" stroke-opacity="0.18"/>
    <rect x="50" y="84" width="392" height="2" fill="#4EF0C4" opacity="0.7"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="70" y="112" fill="#ECF3F1" font-size="16" font-weight="600">AFTERSHOCK</text>
      <text x="70" y="134" fill="#4EF0C4" font-size="11.5" letter-spacing="1.2">KAFKA &#183; SPARK STREAMING &#183; DELTA &#183; AIRFLOW</text>
      <text x="70" y="156" fill="#8FA09C" font-size="12.5">Real-time seismic lakehouse. Replay after a hard kill</text>
      <text x="70" y="172" fill="#8FA09C" font-size="12.5">proven to write no duplicates.</text>
      <text x="70" y="188" fill="#E8A33D" font-size="12.5">735 of 2,128 quakes had their magnitude revised</text>
    </g>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.55s" fill="freeze"/>
    <rect x="458" y="84" width="392" height="112" fill="#0C1214" stroke="#4EF0C4" stroke-opacity="0.18"/>
    <rect x="458" y="84" width="392" height="2" fill="#4EF0C4" opacity="0.7"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="478" y="112" fill="#ECF3F1" font-size="16" font-weight="600">TAINTRACE</text>
      <text x="478" y="134" fill="#4EF0C4" font-size="11.5" letter-spacing="1.2">NEO4J &#183; KAFKA &#183; AIRFLOW &#183; OFAC</text>
      <text x="478" y="156" fill="#8FA09C" font-size="12.5">Sanctions screening over a Bitcoin contamination</text>
      <text x="478" y="172" fill="#8FA09C" font-size="12.5">graph, taint propagated over n hops.</text>
      <text x="478" y="188" fill="#E8A33D" font-size="12.5">512.25 BTC, 11.07% tainted at three hops</text>
    </g>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.85s" fill="freeze"/>
    <rect x="50" y="206" width="392" height="112" fill="#0C1214" stroke="#4EF0C4" stroke-opacity="0.18"/>
    <rect x="50" y="206" width="392" height="2" fill="#4EF0C4" opacity="0.7"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="70" y="234" fill="#ECF3F1" font-size="16" font-weight="600">AI FOR MOLECULAR DESIGN</text>
      <text x="70" y="256" fill="#4EF0C4" font-size="11.5" letter-spacing="1.2">RUST &#183; WEBASSEMBLY &#183; NEXT.JS &#183; CHEMBL</text>
      <text x="70" y="278" fill="#8FA09C" font-size="12.5">EGFR drug discovery, eight notebooks, every model</text>
      <text x="70" y="294" fill="#8FA09C" font-size="12.5">compared against a simple baseline.</text>
      <text x="70" y="310" fill="#E8A33D" font-size="12.5">live in-browser benchmark, Rust vs JavaScript</text>
    </g>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.15s" fill="freeze"/>
    <rect x="458" y="206" width="392" height="112" fill="#0C1214" stroke="#E8A33D" stroke-opacity="0.26"/>
    <rect x="458" y="206" width="392" height="2" fill="#E8A33D" opacity="0.7"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="478" y="234" fill="#ECF3F1" font-size="16" font-weight="600">PHANTERA</text>
      <text x="478" y="256" fill="#E8A33D" font-size="11.5" letter-spacing="1.2">INNGEST &#183; REDIS &#183; STRIPE &#183; LLM EVAL</text>
      <text x="478" y="278" fill="#8FA09C" font-size="12.5">LLM outbound platform, solo-built, pre-launch.</text>
      <text x="478" y="294" fill="#8FA09C" font-size="12.5">Durable orchestration, dedup by event key.</text>
      <text x="478" y="310" fill="#E8A33D" font-size="12.5">CI gated by garak red-teaming and F1/MAE/Spearman</text>
    </g>
  </g>
</svg>
