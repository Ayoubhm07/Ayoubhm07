<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="Under review: microsoft/agent-framework 9139, microsoft/PyRIT 3014, continuedev/continue 13349, apache/iceberg-python 4004, huggingface.js 2510, NVIDIA/garak 2217.">
  <defs>
    <pattern id="r-grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#E8A33D" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <linearGradient id="r-flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8A33D" stop-opacity="0"/>
      <stop offset="50%" stop-color="#E8A33D" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E8A33D" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="900" height="260" fill="#070A0B"/>
  <rect width="900" height="260" fill="url(#r-grid)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="50" y="46" fill="#E8A33D" font-size="13" letter-spacing="5">UNDER REVIEW</text>
    <text x="850" y="46" fill="#64756F" font-size="13" text-anchor="end" letter-spacing="2">06 / OPEN</text>
  </g>
  <line x1="50" y1="62" x2="850" y2="62" stroke="#E8A33D" stroke-opacity="0.22"/>
  <line x1="50" y1="62" x2="850" y2="62" stroke="url(#r-flow)" stroke-width="2" stroke-dasharray="130 670">
    <animate attributeName="stroke-dashoffset" values="800;0" dur="5.5s" repeatCount="indefinite"/>
  </line>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.45s" begin="0.25s" fill="freeze"/>
      <rect x="50" y="86" width="392" height="44" fill="#0F1113" stroke="#E8A33D" stroke-opacity="0.3"/>
      <rect x="50" y="86" width="2.5" height="44" fill="#E8A33D"/>
      <text x="70" y="106" fill="#ECF3F1">microsoft/agent-framework</text>
      <text x="70" y="123" fill="#64756F" font-size="11.5">streamed Gemini chunks lost the model label</text>
      <text x="422" y="106" fill="#E8A33D" text-anchor="end">#9139</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.45s" begin="0.5s" fill="freeze"/>
      <rect x="458" y="86" width="392" height="44" fill="#0F1113" stroke="#E8A33D" stroke-opacity="0.3"/>
      <rect x="458" y="86" width="2.5" height="44" fill="#E8A33D"/>
      <text x="478" y="106" fill="#ECF3F1">microsoft/PyRIT</text>
      <text x="478" y="123" fill="#64756F" font-size="11.5">a Python list repr reached the operator console</text>
      <text x="830" y="106" fill="#E8A33D" text-anchor="end">#3014</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.45s" begin="0.75s" fill="freeze"/>
      <rect x="50" y="140" width="392" height="44" fill="#0F1113" stroke="#E8A33D" stroke-opacity="0.3"/>
      <rect x="50" y="140" width="2.5" height="44" fill="#E8A33D"/>
      <text x="70" y="160" fill="#ECF3F1">continuedev/continue</text>
      <text x="70" y="177" fill="#64756F" font-size="11.5">a provider dropped the stop sequences its twin forwards</text>
      <text x="422" y="160" fill="#E8A33D" text-anchor="end">#13349</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.45s" begin="1s" fill="freeze"/>
      <rect x="458" y="140" width="392" height="44" fill="#0F1113" stroke="#E8A33D" stroke-opacity="0.3"/>
      <rect x="458" y="140" width="2.5" height="44" fill="#E8A33D"/>
      <text x="478" y="160" fill="#ECF3F1">apache/iceberg-python</text>
      <text x="478" y="177" fill="#64756F" font-size="11.5">42% faster predicates, plus a silent empty-filter bug</text>
      <text x="830" y="160" fill="#E8A33D" text-anchor="end">#4004</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.45s" begin="1.25s" fill="freeze"/>
      <rect x="50" y="194" width="392" height="44" fill="#0F1113" stroke="#E8A33D" stroke-opacity="0.3"/>
      <rect x="50" y="194" width="2.5" height="44" fill="#E8A33D"/>
      <text x="70" y="214" fill="#ECF3F1">huggingface/huggingface.js</text>
      <text x="70" y="231" fill="#64756F" font-size="11.5">a test assumed symlinks instead of detecting them</text>
      <text x="422" y="214" fill="#E8A33D" text-anchor="end">#2510</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.45s" begin="1.5s" fill="freeze"/>
      <rect x="458" y="194" width="392" height="44" fill="#0F1113" stroke="#E8A33D" stroke-opacity="0.3"/>
      <rect x="458" y="194" width="2.5" height="44" fill="#E8A33D"/>
      <text x="478" y="214" fill="#ECF3F1">NVIDIA/garak</text>
      <text x="478" y="231" fill="#64756F" font-size="11.5">English-only detectors misjudge other languages, both ways</text>
      <text x="830" y="214" fill="#E8A33D" text-anchor="end">#2217</text>
    </g>
  </g>
</svg>
