<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Merged upstream: apache/beam 40430 approved without a change, tobymao/sqlglot 8519 merged 34 minutes after the issue, PrefectHQ/prefect 23281.">
  <defs>
    <pattern id="m-grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#4EF0C4" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <linearGradient id="m-flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4EF0C4" stop-opacity="0"/>
      <stop offset="50%" stop-color="#4EF0C4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4EF0C4" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="900" height="300" fill="#070A0B"/>
  <rect width="900" height="300" fill="url(#m-grid)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="50" y="46" fill="#4EF0C4" font-size="13" letter-spacing="5">MERGED UPSTREAM</text>
    <text x="850" y="46" fill="#64756F" font-size="13" text-anchor="end" letter-spacing="2">03 / APPROVED</text>
  </g>
  <line x1="50" y1="62" x2="850" y2="62" stroke="#4EF0C4" stroke-opacity="0.2"/>
  <line x1="50" y1="62" x2="850" y2="62" stroke="url(#m-flow)" stroke-width="2" stroke-dasharray="130 670">
    <animate attributeName="stroke-dashoffset" values="800;0" dur="5s" repeatCount="indefinite"/>
  </line>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.3s" fill="freeze"/>
    <rect x="50" y="84" width="800" height="58" fill="#0C1214" stroke="#4EF0C4" stroke-opacity="0.18"/>
    <rect x="50" y="84" width="3" height="58" fill="#4EF0C4"/>
    <circle cx="74" cy="104" r="4" fill="#4EF0C4"/>
    <circle cx="74" cy="104" r="4" fill="none" stroke="#4EF0C4">
      <animate attributeName="r" values="4;16" dur="2.8s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.9;0" dur="2.8s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="92" y="109" fill="#ECF3F1" font-size="15" font-weight="600">apache/beam</text>
      <text x="238" y="109" fill="#4EF0C4" font-size="15">#40430</text>
      <text x="840" y="109" fill="#E8A33D" font-size="11.5" text-anchor="end" letter-spacing="1.4">APPROVED WITHOUT A CHANGE</text>
      <text x="92" y="130" fill="#8FA09C" font-size="12.5">a debug log that shipped with the BigQuery Read API in 2021 and survived five years</text>
    </g>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.85s" fill="freeze"/>
    <rect x="50" y="152" width="800" height="58" fill="#0C1214" stroke="#4EF0C4" stroke-opacity="0.18"/>
    <rect x="50" y="152" width="3" height="58" fill="#4EF0C4"/>
    <circle cx="74" cy="172" r="4" fill="#4EF0C4"/>
    <circle cx="74" cy="172" r="4" fill="none" stroke="#4EF0C4">
      <animate attributeName="r" values="4;16" dur="2.8s" begin="0.85s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.9;0" dur="2.8s" begin="0.85s" repeatCount="indefinite"/>
    </circle>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="92" y="177" fill="#ECF3F1" font-size="15" font-weight="600">tobymao/sqlglot</text>
      <text x="268" y="177" fill="#4EF0C4" font-size="15">#8519</text>
      <text x="840" y="177" fill="#E8A33D" font-size="11.5" text-anchor="end" letter-spacing="1.4">MERGED 34 MIN AFTER THE ISSUE</text>
      <text x="92" y="198" fill="#8FA09C" font-size="12.5">seed 5, seed 99 and no seed produced identical SQL &#8212; the fix made the repo agree with itself</text>
    </g>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.4s" fill="freeze"/>
    <rect x="50" y="220" width="800" height="58" fill="#0C1214" stroke="#4EF0C4" stroke-opacity="0.18"/>
    <rect x="50" y="220" width="3" height="58" fill="#4EF0C4"/>
    <circle cx="74" cy="240" r="4" fill="#4EF0C4"/>
    <circle cx="74" cy="240" r="4" fill="none" stroke="#4EF0C4">
      <animate attributeName="r" values="4;16" dur="2.8s" begin="1.4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.9;0" dur="2.8s" begin="1.4s" repeatCount="indefinite"/>
    </circle>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="92" y="245" fill="#ECF3F1" font-size="15" font-weight="600">PrefectHQ/prefect</text>
      <text x="294" y="245" fill="#4EF0C4" font-size="15">#23281</text>
      <text x="840" y="245" fill="#E8A33D" font-size="11.5" text-anchor="end" letter-spacing="1.4">MERGED</text>
      <text x="92" y="266" fill="#8FA09C" font-size="12.5">a notification block silently dropped the bot name its siblings honour</text>
    </g>
  </g>
</svg>
